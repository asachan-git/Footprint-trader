# Deployed strategies — the StrategyManager loads every enabled entry here.
#
# Each entry:
#   name     : must match a key in strategies/registry.py REGISTRY
#   enabled  : false = registered but not deployed
#   config   : strategy-specific overrides (passed to the Strategy ctor)
#
# Data layout:
#   COMMON       : data/footprint/*, config/, logs/   (shared by all strategies)
#   PER-STRATEGY : data/strategies/<name>/{positions,cycles,decisions,equity}.jsonl
#
# Results are reported per strategy via GET /strategies/<name>/results.

strategies:
  - name: democracy
    enabled: true
    config:
      # Symbols this strategy trades. Omit to inherit vp_cache.symbols / instrument.
      symbols: [BTCUSDT, XAUTUSDT]
      # Timeframe the vote panel evaluates structure on (independent of feed TF).
      vote_tf: 15m

  # republic = democracy's signal + a real hard stop (constitution).
  # Same votes as democracy; clamps grid safety_sl to sl_atr_mult×ATR instead of
  # the far disaster floor. A/B for the WR-vs-RR tradeoff. See STRATEGIES.md §3.
  - name: republic
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      sl_atr_mult: 1.5      # hard SL distance from anchor, in ATR_15m units
      sl_struct_buf_atr: 0.2  # SL = candle extreme ± this×ATR (when VP/LVN-confluent)
      sl_conf_tol_atr: 0.25   # VP/LVN confluence tolerance, ×ATR

  # senate = republic's engine, SL anchored to footprint WALLS instead of the
  # candle extreme. SL just beyond the favourable stacked-imbalance / big-trade
  # levels on the stop side ("selling zone in our favour"); VP-confluent walls
  # tagged wall_vp; ATR fallback. SL-anchor A/B vs republic on the same signal.
  # Validated scripts/validate_sl_levels.py: wall ≈ +0.31R vs +0.17R ATR (confirmed).
  - name: senate
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      sl_atr_mult: 1.5        # ATR fallback distance when no wall present
      sl_wall_buf_atr: 0.25   # SL = beyond the farthest favourable wall ± this×ATR
      sl_conf_tol_atr: 0.25   # wall∧VP confluence tolerance (tags wall_vp), ×ATR

  # congress = democracy/republic vote, but ENTERED at the AGGRESSION-side stacked
  # imbalance with the stop just below its low (long → buy-stack base; short → sell-
  # stack high). LIMIT entry waits ≤entry_expiry_bars for a retrace touch into the
  # imbalance (else voids), so the fill is at the ignition base, not chased. Tight
  # stop → high R:R; republic VP TP supplies the target. Distinct from senate (stops
  # beyond the DEFENSIVE wall). Two instances A/B the entry level. PROVISIONAL — paper.
  # Live 24h (2026-06-04): congress_lvn +9.0R/40%/+0.90avg (BTC +9.2R, XAUT −0.2R);
  # congress_start +3.4R. BTC-only edge — XAUT thin. Restored to main 2026-06-04.
  - name: congress_start
    class: congress
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      entry_mode: imb_start   # base where the aggression imbalance starts
      entry_expiry_bars: 3
      min_sl_atr_mult: 0.5
      sl_atr_mult: 1.5        # republic fallback when no aggression imbalance

  - name: congress_lvn
    class: congress
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      entry_mode: imb_lvn     # low-vol gap inside the aggression imbalance
      entry_expiry_bars: 3
      min_sl_atr_mult: 0.5
      sl_atr_mult: 1.5

  # coup = climax + next-bar delta-flip + VP-extreme (the validated reversal thesis),
  # ignition-bar entry. The old absorption→continuation trigger was RETIRED 2026-06-03
  # (live: coup family −4.3R, 9% WR; the extreme-zone aggressor read is a coin flip —
  # see project-reversal-study). trigger_mode=climax_flip routes Coup.decide at
  # reversal_pattern.detect (vol≥vol_mult×median pivot, next bar flips reversal-aligned
  # delta + closes the reversal way, gated to value-area extremes, skip HVN), entering
  # MARKET at the ignition (flip) bar — no 2-bar lag. SL = trapped-side imbalance far
  # edge (swing fallback) + ATR floor; 2R TP; flip + hard-SL exit. coup = STRICT
  # thresholds; coup_reversal below = LOOSER (threshold A/B, both VP-gated).
  - name: coup
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]   # XAU for data (paper)
      trigger_mode: climax_flip
      decide_tf: 15m
      vol_mult: 2.0          # climax: pivot vol ≥ 2× median(prior 20)
      delta_swing: 50.0      # next-bar reversal-aligned delta swing vs the pivot
      vp_filter: true        # fade value-area extremes, skip HVN magnets
      min_sl_atr_mult: 0.5   # floor SL distance at 0.5×ATR (no degenerate stops)
      flip_exit: false          # retire absorption-flip exit (weak detector cut trades early)
      cvd_divergence_exit: true # cut when CVD exhausts against the cycle
      cvd_exit_conf: 0.65

  # coup_reversal = same climax_flip trigger, LOOSER thresholds (vol_mult 1.8,
  # delta_swing 0) → more signals; the threshold A/B vs strict `coup`. Both VP-gated,
  # ignition-bar market entry. (Distinct from `reversal`/`reversal_si`, which use
  # lvn-limit / SI-ignition entries on the same trigger.)
  - name: coup_reversal
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]   # XAU for data (paper)
      trigger_mode: climax_flip
      decide_tf: 15m
      vol_mult: 1.8
      delta_swing: 0.0
      vp_filter: true
      min_sl_atr_mult: 0.5
      flip_exit: false          # retire absorption-flip exit (weak detector cut trades early)
      cvd_divergence_exit: true # cut when CVD exhausts against the cycle
      cvd_exit_conf: 0.65

  # reversal = the VP-gated climax-pivot → next-bar-delta-flip setup
  # (scripts/reversal_study.py + reversal_pattern_backtest.py). Distinct mechanic
  # from coup_reversal: a CAUSAL swing pivot with climax volume, then a next candle
  # that flips reversal-aligned delta and closes the reversal way, ENTERED only when
  # it FADES a value-area extreme (long ≤ VAL / short ≥ VAH) and is NOT nearest a HVN
  # magnet. Raw pattern ~breakeven; the VP gate + structural SL was the only filter
  # that turned it PF-positive in backtest (VA-extreme + imbalance SL → PF ~1.50 vs
  # 0.95, n=57). PROVISIONAL — edge skewed short over one down-week, so it runs in
  # PAPER to accumulate cross-regime out-of-sample samples. Own store:
  # data/strategies/reversal/. Market entry at the flip-bar close; structural SL =
  # trapped-side stacked-imbalance edge (swing high/low fallback); forced 2R TP;
  # flip + hard-SL exit (inherited from coup).
  # DISABLED 2026-06-04 — REPLACED by the reversal_choch family below. The climax-
  # pivot `reversal` ran net-negative in paper (2 closed: −0.16R, −1.0R) so its slot
  # is handed to the ChoCh→Fib structure model. Class kept (reversal_si subclasses it).
  - name: reversal
    enabled: false
    config:
      symbols: [BTCUSDT]
      decide_tf: 15m
      vol_mult: 2.0        # climax: pivot vol ≥ 2× median(prior 20)
      delta_swing: 50.0    # next-bar reversal-aligned delta swing vs the pivot
      vp_filter: true      # ONLY fade value-area extremes, skip HVN magnets
      # Entry A/B (BTC+XAU, VP-gated, imbalance SL, 2R): lvn LIMIT best per-trade
      # (PF 2.0, +0.50R, but 38% fill); market most fills (PF 1.33, +0.17R, 96%);
      # imbalance near-edge worst (PF 1.23). lvn = limit at the low-volume bin
      # between the pivot extreme and POC; decide() waits ≤entry_expiry_bars for a
      # retrace touch (else voids). Switch to "market" for more fills / fewer misses.
      entry_mode: lvn       # market | lvn | imbalance
      entry_expiry_bars: 3  # bars a LIMIT waits for the touch before voiding
      # SL = trapped-side stacked-imbalance far edge (swing high/low fallback) — set
      # by the detector. Dynamic exits: absorption-flip + hard-SL (from coup) +
      # CVD-divergence-against (cut when order-flow exhausts against us) + POC-trail
      # (cycle_manager, unconditional). 2R TP kept.
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65   # min CVD-signal confidence to trigger the exit

  # reversal_eqhl = fade a SWEPT equal-high/low liquidity cluster back to value.
  # Trigger: a fresh, delta-confirmed sweep of an EqH/EqL stop cluster (from the
  # sweep registry — swept EqH → fade SHORT, swept EqL → fade LONG). CVD divergence
  # is OPTIONAL sauce (confirming bear/bull div → +conf/+bias, not required). TP =
  # OPPOSITE value-area extreme (cached daily VP: short→VAL, long→VAH; POC magnet
  # fallback, else 2R). SL just beyond the sweep wick extreme. Reuses coup exits
  # (hard-SL + CVD-divergence + POC-trail). PROVISIONAL — paper, accruing samples.
  # DISABLED 2026-06-06 — REFUTED. Bracket backtest: PF 0.55 (avgR −0.35), negative
  # across every variant. Fading swept levels has no edge; the edge is trading WITH
  # the delta (see reversal_anchor). Kept registered for reference.
  - name: reversal_eqhl
    enabled: false
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      max_sweep_age: 3        # bars since the grab — must be fresh
      require_reclaim: false  # true = only fade swept+reclaimed clusters (stricter)
      # Selectivity (added 2026-06-06 — was firing on ~every candle): reuse the
      # maintained swing H/L list and keep only swept levels that span a real swing
      # range and are CLOSE to current price.
      min_swing_range_atr: 2.5  # swing leg (to nearest opposite pivot) ≥ this×ATR
      proximity_atr: 2.0        # swept level must be within this×ATR of current price
      # XAUT forms more near-price significant eq-structure → runs hotter at the same
      # gates; tighten it per-symbol (BTC ~5%, XAUT ~8% of bars).
      per_symbol:
        XAUTUSDT:
          min_swing_range_atr: 3.5
          proximity_atr: 1.5
      sl_buf_atr: 0.10
      min_sl_atr_mult: 0.5
      max_rr: 4.0             # TP = POC magnet (opposite VA extreme backup), capped at 4R
      # CVD sauce now uses the shared remembered-div cache (cvd_div_state), same as
      # reversal_hvn: an aligned div within cvd_div_window bars → +conf/+bias.
      cvd_div_window: 2
      cvd_div_strength: 0.0   # min div strength for the sauce (0 = any)
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  # reversal_hvn = fade a candle that SWEEPS a prior swing/eq High-Low sitting at an
  # HVN extreme and CLOSES BACK INSIDE the HVN (breakout rejected into value).
  # swept HVN top→fade SHORT, swept HVN low→fade LONG. FILTER (required): a CVD
  # divergence on the CURRENT candle aligned with the fade (live scan_divergences
  # marker). HVN from rolling N-bar VP (cached-daily fallback). TP = POC magnet
  # (opposite VA extreme backup) RR-clamped; SL beyond the sweep wick. Coup exits
  # (hard-SL + CVD-divergence + POC-trail). PROVISIONAL — paper, accruing samples.
  # DISABLED 2026-06-06 — REFUTED (fade). Bracket backtest PF 0.38 (avgR −0.56).
  # Same lesson as reversal_eqhl: don't fade swept levels. Kept registered.
  - name: reversal_hvn
    enabled: false
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      coincide_atr: 0.3       # HVN extreme must sit within 0.3×ATR of a prior swing
      # Significance + proximity (same as reversal_eqhl): the coinciding prior swing
      # must span a real range and sit near price. Per-symbol overrides supported.
      min_swing_range_atr: 2.5
      proximity_atr: 2.0
      per_symbol:
        XAUTUSDT:
          min_swing_range_atr: 2.5   # dialed back from 3.5 (hvn already sparse — don't starve)
          proximity_atr: 1.5
      cvd_div_strength: 0.0   # min CVD-div strength to pass the filter (0 = any)
      cvd_div_window: 2       # accept an aligned CVD div from the last N bars (not just live)
      sl_buf_atr: 0.10
      min_sl_atr_mult: 0.5
      max_rr: 4.0
      min_rr: 1.0
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  # reversal_anchor = DEFEND a high-delta anchor zone, trade WITH the anchor's delta,
  # gated to WITH-TREND. The validated inversion of the refuted fades: price re-enters
  # an anchor_bar zone (vol>2σ,|delta|>2σ) and defends in the anchor's delta direction
  # (bullish anchor→long, bearish→short) → join it. Regime gate is the big lever —
  # bracket backtest (15m, BTC+XAUT, 2R): ALL PF 1.69 → with-trend PF 2.91 (+0.73R);
  # counter-trend loses. SL beyond the anchor extreme; 2R TP. coup single-entry + hard-
  # SL. PROVISIONAL — paper, IN-SAMPLE only (n=21 with-trend); needs out-of-sample.
  # DISABLED 2026-06-06 — REFUTED on REAL delta. The PF 2.7-2.9 was a synthetic-data
  # artifact (½ the history was kline-synthetic). On clean 30d Binance aggTrade delta:
  # ALL PF 0.71, with-trend PF 0.58 (LOSING). EqHL-continuation PF 0.92 — also dead.
  # Whole sweep/anchor reversal family has no edge on real data. Kept registered.
  - name: reversal_anchor
    enabled: false
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      require_with_trend: true  # only trade when side agrees with the 20-bar trend
      allow_range: false        # set true to also take range-regime (marginal, PF~1.2)
      regime_n: 20              # trend window (bars)
      trend_t: 2.0              # |slope| ≥ this×ATR over regime_n = trend
      rr_target: 2.0            # TP = rr_target × risk (matches the validated bracket)
      sl_buf_atr: 0.10
      min_sl_atr_mult: 0.5

  # reversal_si = reversal pattern, stacked-imbalance IGNITION entry + footprint-
  # managed exit. Separate store; runs alongside `reversal` (lvn entry / 2R) for a
  # live A/B. Entry: the VP-gated flip must ALSO print a fresh trade-direction
  # stacked imbalance on the flip bar (orderflow ignition); market entry at the flip
  # close; SL just beyond that stack's far low/high. Target: opposite-side LVN
  # (value vacuum) in the profit direction → else next unfilled FVG → else 2R, set as
  # the TP cap. Exits: absorption-flip + CVD-divergence (early reversal) + SI-trail
  # (tighten SL under each bar's stacked imbalance) + hard-SL. PROVISIONAL — paper.
  - name: reversal_si
    enabled: true
    config:
      symbols: [BTCUSDT]
      decide_tf: 15m
      vol_mult: 2.0
      delta_swing: 50.0
      vp_filter: true       # fade value-area extremes, skip HVN magnets
      entry_mode: si_flip   # fresh trade-direction stacked imbalance on the flip bar
      target_mode: vp_lvn   # opposite LVN → FVG → 2R fallback
      si_trail: true        # trail SL under each bar's trade-direction stacked imbalance
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  # ──────────────────────────────────────────────────────────────────────────────
  # 5m PARALLEL INSTANCES — every strategy also runs on 5m alongside its 15m twin
  # for a TF A/B (finer entries/exits). `class` reuses the registered class under a
  # new instance name → separate store (data/strategies/<name>_5m/). The manager
  # gates entry to each instance's decide_tf/vote_tf, so 5m and 15m never cross-fire.
  # The 5m feed is noisier; vote-panel TFs (democracy/republic/senate) are calibrated
  # on 15m, so treat their 5m results as exploratory. Disable any that underperform.
  # ──────────────────────────────────────────────────────────────────────────────
  - name: democracy_5m
    class: democracy
    enabled: true
    config: { symbols: [BTCUSDT, XAUTUSDT], vote_tf: 5m }

  # DISABLED 2026-06-03 — 5m vote panel bled (republic_5m −1.8R/37%, senate_5m
  # −11.0R/39%) vs 15m twins +16.4R/+10.7R. Vote logic is 15m-calibrated; 5m = noise.
  - name: republic_5m
    class: republic
    enabled: false
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 5m
      sl_atr_mult: 1.5
      sl_struct_buf_atr: 0.2
      sl_conf_tol_atr: 0.25

  - name: senate_5m
    class: senate
    enabled: false
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 5m
      sl_atr_mult: 1.5
      sl_wall_buf_atr: 0.25
      sl_conf_tol_atr: 0.25

  - name: coup_5m
    class: coup
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]   # XAU for data (paper)
      trigger_mode: climax_flip
      decide_tf: 5m
      vol_mult: 2.0
      delta_swing: 50.0   # NOTE: 5m delta smaller — may need lowering after data
      vp_filter: true
      min_sl_atr_mult: 0.5
      flip_exit: false          # retire absorption-flip exit (weak detector cut trades early)
      cvd_divergence_exit: true # cut when CVD exhausts against the cycle
      cvd_exit_conf: 0.65

  - name: coup_reversal_5m
    class: coup_reversal
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]   # XAU for data (paper)
      trigger_mode: climax_flip
      decide_tf: 5m
      vol_mult: 1.8
      delta_swing: 0.0
      vp_filter: true
      min_sl_atr_mult: 0.5
      flip_exit: false          # retire absorption-flip exit (weak detector cut trades early)
      cvd_divergence_exit: true # cut when CVD exhausts against the cycle
      cvd_exit_conf: 0.65

  # DISABLED 2026-06-04 — replaced alongside its 15m twin (see reversal_choch family).
  - name: reversal_5m
    class: reversal
    enabled: false
    config:
      symbols: [BTCUSDT]
      decide_tf: 5m
      vol_mult: 2.0
      delta_swing: 50.0   # NOTE: 5m delta is smaller — may need lowering after data
      vp_filter: true
      entry_mode: lvn
      entry_expiry_bars: 3
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  - name: reversal_si_5m
    class: reversal_si
    enabled: true
    config:
      symbols: [BTCUSDT]
      decide_tf: 5m
      vol_mult: 2.0
      delta_swing: 50.0
      vp_filter: true
      entry_mode: si_flip
      target_mode: vp_lvn
      si_trail: true
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  # ──────────────────────────────────────────────────────────────────────────────
  # reversal_choch — structure-flip reversal (replaces climax-pivot `reversal`).
  # WAIT while 15m trend holds (no continuation trades); on a 15m ChoCh (break of the
  # last HL/LH) arm a LONG (bull ChoCh) / SHORT (bear ChoCh) reversal: LIMIT at the
  # fib_entry retrace of the impulse leg (origin swing → break extreme), TP at the
  # fib_ext extension, SL beyond the swing origin. Three Fib A/B variants run in PAPER
  # in parallel (separate stores) to find the best entry/extension pair. 15m only —
  # the ChoCh is defined on 15m structure.
  # ──────────────────────────────────────────────────────────────────────────────
  # Params tuned by scripts/reversal_choch_backtest.py (BTC+XAU 15m sweep, 2026-06-04):
  # fib_ext is the dominant lever — 2.0 wins everywhere, 1.272 loses everywhere (this
  # is a low-WR ~28% / high-RR system; short TPs starve it). fib_entry 0.705 (OTE) >
  # 0.618 > 0.5. Best: 0.705/2.0 PF 2.03 (n=14). arm_within is inert (ChoCh breaks are
  # always fresh in-sample) → left default 10. Thin sample → PAPER, A/B keeps entry/ext
  # diversity around the winner. Symbols incl. XAU (it carried the edge; BTC was weak).
  - name: reversal_choch          # A — sweep winner 0.705 / 2.0
    class: reversal_choch
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      fib_entry: 0.705
      fib_ext: 2.0
      entry_expiry_bars: 6
      cvd_divergence_exit: true   # validated 2026-06-04: reversal CVD-div exit +0.21R/15m vs +0.04R fixed
      cvd_exit_conf: 0.65

  - name: reversal_choch_ext      # B — 0.705 / 1.618 (PF 1.57)
    class: reversal_choch
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      fib_entry: 0.705
      fib_ext: 1.618
      entry_expiry_bars: 6
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  - name: reversal_choch_entry    # C — 0.618 / 2.0 (PF 1.29; entry-depth A/B)
    class: reversal_choch
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      fib_entry: 0.618
      fib_ext: 2.0
      entry_expiry_bars: 6
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65

  # ──────────────────────────────────────────────────────────────────────────────
  # wave_fib — trend-CONTINUATION Fib (the with-trend complement to reversal_choch).
  # WAIT for a two-wave structure to confirm (HH+HL = uptrend / LL+LH = downtrend),
  # then join the 3rd wave: LIMIT into the wave-2 pullback (entry from the VP of the
  # two-wave structure, or a Fib retrace), TP = fib_ext × wave-1 measured move from the
  # pullback pivot, SL beyond the HL/LH (structure invalidation). 15m only.
  # Tuned by scripts/wave_fib_backtest.py (BTC+XAU 15m, 2026-06-04): VP-value entry +
  # 2.0× measured move = PF 3.36, +58.9R, n=35, POSITIVE on BOTH symbols (BTC PF 4.26,
  # XAU 2.53). Low WR ~29% / high RR — fat targets carry it; PF somewhat tail-driven,
  # n=35 moderate → PAPER. Variants A/B the entry source + TP.
  # ──────────────────────────────────────────────────────────────────────────────
  - name: wave_fib                # A — sweep winner: VP-value entry / 2.0× MM
    class: wave_fib
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      entry_mode: vp
      vp_level: value             # VAL (long) / VAH (short) — discount/premium edge
      fib_ext: 2.0
      entry_expiry_bars: 6

  - name: wave_fib_ret            # B — explicit Fib-retrace entry: 0.5 / 2.0× MM (PF 2.45)
    class: wave_fib
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      entry_mode: fib
      fib_entry: 0.5
      fib_ext: 2.0
      entry_expiry_bars: 6

  - name: wave_fib_ext            # C — VP-value entry / 1.618× MM (TP A/B; PF 2.76)
    class: wave_fib
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      entry_mode: vp
      vp_level: value
      fib_ext: 1.618
      entry_expiry_bars: 6

  # ── CVD-div ENTRY-GATE A/B ──────────────────────────────────────────────────
  # Gated twins of the vote / wave_fib / congress families: same signal, but skip
  # entries whose side OPPOSES the last confirmed 15m CVD-divergence (manager-level
  # gate, config.cvd_div_gate). The ungated originals above are the A arm; these
  # _cvd instances are B. Validated net-positive on 15m in dryrun_fleet (fleet
  # +52→+80R over 824 trades, vote PF 1.06→1.27) — live paper A/B to confirm out of
  # sample. (Gate is 15m explicitly; primary_tf=1m so the cvd_div_state cache is 1m.)
  - name: democracy_cvd
    class: democracy
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      cvd_div_gate: true

  - name: congress_start_cvd
    class: congress
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      vote_tf: 15m
      entry_mode: imb_start
      entry_expiry_bars: 3
      min_sl_atr_mult: 0.5
      sl_atr_mult: 1.5
      cvd_div_gate: true

  - name: wave_fib_cvd
    class: wave_fib
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      entry_mode: vp
      vp_level: value
      fib_ext: 2.0
      entry_expiry_bars: 6
      cvd_div_gate: true

  - name: reversal_si_cvd          # gated twin (clean-delta dryrun: −8.53→+0.62R)
    class: reversal_si
    enabled: true
    config:
      symbols: [BTCUSDT]            # match ungated reversal_si for a fair A/B
      decide_tf: 15m
      vol_mult: 2.0
      delta_swing: 50.0
      vp_filter: true
      entry_mode: si_flip
      target_mode: vp_lvn
      si_trail: true
      cvd_divergence_exit: true
      cvd_exit_conf: 0.65
      cvd_div_gate: true

  # continuation_hvn = the CONTINUATION half of the HVN/LVN model (reversal_hvn = the
  # fade half). High-vol + high-delta ignition bar, windowed-CVD-agree gate, MARKET
  # entry, ride the next HVN→HVN; stop just beyond the nearest HVN-support against the
  # trade. Validated offline (validate_continuation.py) + re-confirmed on repaired
  # real-tick footprint 2026-06-16: +0.323R / 23% WR (CVD-agree, HVN-support stop).
  - name: continuation_hvn
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      vol_mult: 1.5
      delta_ratio: 0.35
      cvd_window: 20
      min_hvn_dist: 1.0
      stop_mode: hvn
      min_sl_atr_mult: 0.5

  # SL-A/B twin: same trigger/target, LVN-stop instead of HVN-support. On repaired
  # data LVN-stop scored higher (+0.705R / 40% WR) — under test vs the documented HVN
  # form. See [[project_continuation_cvddiv]], [[project_sl_ab]].
  - name: continuation_hvn_lvn
    class: continuation_hvn
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 15m
      vol_mult: 1.5
      delta_ratio: 0.35
      cvd_window: 20
      min_hvn_dist: 1.0
      stop_mode: lvn
      min_sl_atr_mult: 0.5

  # ict_fvg — ICT/SMC directional: HTF(15m) unmitigated-FVG rejection arms a bias;
  # LTF(1m) ChoCh → Fib premium (0.5-0.786, focus 0.618) → a 1m FVG in the zone.
  # Sell/buy-limit at the 1m FVG midpoint (armed in-strategy, fills on touch). Static
  # SL outside the FVG wick +buffer; hard 4R TP (or next 15m-FVG mid); BE at +1R
  # (≈ ChoCh swing low). decide_tf=1m. PAPER. v1: no candle-trail / R-partials.
  - name: ict_fvg
    enabled: true
    config:
      symbols: [BTCUSDT, XAUTUSDT]
      decide_tf: 1m
      htf_tf: 15m
      htf_fvg_max_age: 100
      htf_arm_bars: 4
      swing_n: 2
      choch_lookback: 200
      arm_within: 10
      ltf_fvg_max_age: 50
      fib_lo: 0.5
      fib_hi: 0.786
      fib_focus: 0.618
      entry_expiry_bars: 30
      sl_buf_atr: 0.10
      min_sl_atr_mult: 0.5
      tp_mode: r          # r = hard tp_r·R | fvg = next unmitigated 15m FVG mid
      tp_r: 4.0
      min_rr: 1.5
      be_at_r: 1.0
      # LIVE execution on the direct wine-rpyc MT5 adapter (real SL-modify/BE/partials —
      # the reason this strategy can't run on the stop-only EA bridge). Default OFF →
      # stays paper. Flip true + set ALLOW_LIVE=1 + run scripts/mt5_server.sh to go live.
      # Routes ONLY ict_fvg to the direct adapter (magic 770010); fleet stays paper.
      live_direct: false
