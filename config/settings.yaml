mode: live              # journal | paper | live  (live also needs env ALLOW_LIVE=1)
trading_mode: grid            # buy_sell_only | grid  (grid: Claude designs full 5-leg plan via submit_grid_plan; buy_sell_only: mechanical Fib placer)

# Standardized data window across all analysis modules (sweep, delta_div, wick_trap, cvd_vote)
analysis:
  standard_lookback: 20    # bars (primary TF for short-window modules; 15m for direction engine)

# Regime gate — refuse entries against confirmed trend
regime:
  block_against_trend_confidence: 0.75   # day_type.confidence threshold to block

# Catastrophic-trend escape — force-close cycle if price runs against without bounce
cycle:
  trend_escape:
    bars: 3              # K consecutive bars against
    atr_mult: 1.5        # N x ATR adverse from avg_entry
  poc_trail_min_atr_mult: 0.5   # TP must stay ≥ 0.5×ATR from avg_entry when trailing to POC
  # Aggressive scale-out (grid_sim.py "aggressive keep2"): on first bounce
  # PROFIT_BUF×ATR beyond avg, close the deep large-lot legs (bought cheap → in
  # profit), keep `keep_near` nearest legs, move them to break-even. Converts
  # bounce-then-die cycles into scratches. Trades ~⅓ total return for ~halved
  # adverse-market deaths + exposure. DEFAULT OFF — A/B on paper before enabling.
  scale_out:
    enabled: false
    keep_near: 2          # nearest legs to keep riding to TP
    profit_buf_atr: 0.5   # bounce trigger: price this many ATR beyond avg_entry

# Event-driven decide trigger — fires Mode 1 + Mode 2 instantly when a new TF
# bar is emitted by mtf_aggregator (replaces wall-clock cron loops in start.sh).
decide_on_bar_close:
  enabled: true
  tf: 15m            # legacy default decide TF (Claude per-bar + fallback gate)
  tfs: [5m, 15m]     # strategy-manager ENTRY ticks fire on each of these synthetic closes;
                     # each strategy enters only on its own decide_tf/vote_tf (manager-gated)

instrument:
  symbol: XAUTUSDT
  timeframes: [1m, 5m, 15m, 1h]   # dropped 3m/10m (2026-07-29): added Jul20 for a since-abandoned
                                   # TF-efficiency run, footprint data for them is 7.2d stale, and
                                   # this crude system doesn't trade them — startup preflight blocks
                                   # boot on stale required-TF data, so trim rather than backfill
                                   # data we don't need. The crude restriction to 15m for actual
                                   # trading lives in grid_levels.triggers below, not here.
  primary_tf: 1m           # raw feed is always 1m; server aggregates up (unchanged from before)

# Feed-gap monitor + self-heal (pipeline/feed_monitor.py). Watches the primary-TF series;
# WARNs on stall and RECOVERY, and — when the feed recovers from a stall — auto-backfills the
# exact missed window from Binance aggTrades (real footprint, not OHLC-only) so the 1m series
# has no hole. The 2026-07-15 audit found 62 real intra-session gaps (~22h) that nothing ever
# healed. Existing per-symbol fetch settings mirror scripts/start.sh feed launch args.
monitor:
  gap_monitor_enabled: true        # master switch for the stall/recovery watcher
  gap_backfill_enabled: true       # auto-heal the missed window on stale→ok recovery
  max_backfill_minutes: 1440       # clamp: skip auto-heal for spans larger than this
                                   # (a multi-day hole = cold-start; use scripts/backfill_binance.py)
  # gap_alert_secs: 180            # override: stall threshold (default 3× the primary-TF period)
  # gap_check_secs: 30             # override: how often to poll feed health
  # backfill_feeds:                # override store_symbol → Binance fetch symbol + price bucket
  #   XAUTUSDT: {binance_symbol: XAUUSDT, price_step: 0.1}
  #   BTCUSDT:  {binance_symbol: BTCUSDT, price_step: 1.0}

# Footprint-driven neutral-grid placement (/exec/emit_grid + FBExecBridge EA).
# Planner reads these via .get() defaults — block is optional but canonical here.
grid_levels:

  # ── FINAL v1 (branched 2026-08-03 off feat/crude-hvn-rotation) ───────────────
  # Setup list chosen from the ONLY four net-positive strat×TF cells across 616 live
  # cycles (Jun22-Jul20, 4 accounts): hvn_inside_touch 15m (+1,058/cyc, 67%),
  # hvn_inside_touch 5m (+432/cyc, 69% — best win rate in the dataset), lvn_edge_touch
  # 15m (+1,007/cyc, 65%). hvn_edge 15m EXCLUDED: +258/cyc over 24 cycles whose worst
  # single cycle (-7,421) exceeds its whole contribution, and it sign-flips by era.
  # 240 cycles · +166,560 · +694/cyc · 68% win.
  #
  # Every FILTER tried against this system (squeeze, expansion, HTF expansion,
  # CVD-divergence, coil-no-release) raised win rate and CUT total profit — the cycles
  # they removed were profitable. Setup selection is the only lever that improved both.
  # Do not re-add gates without re-reading docs/learnings_2026-07-30.md §23-§25.
  # Inherited from the crude Jun22 HVN-rotation branch (2026-07-29):
  # Thesis: price travels HVN-to-HVN and rotates inside HVNs. Candle-close confirmation
  # only (no touch-arm), Jun22-shaped exit stack. base_lot scaled 0.01->0.25 (25x) using
  # 7991bc9's methodology: every $-denominated knob scales with lot size, every
  # price-domain knob (min_tp_dist, step mults) does NOT.
  #
  # flatten_rest_enabled stays FALSE, deviating from literal Jun22 (which had no such
  # flag, so the code default True applied — every one of the 616 historical cycles ran
  # with leg-TP-closes-cycle ACTIVE). Two reasons it stays off: the flatten-rest /
  # leg_closed_other path is what dumped 6 buy legs for -$110k in under 4 seconds on
  # 2026-07-14, and leg_tp as a full-cycle exit measured 20% win / -21.5 mean over 44
  # live exits. The cost of turning it off — no loss-side exit at all — is now covered
  # by disaster_sl_usd (broker-side) and cycle_max_loss_usd (server-side), both below.
  # Do NOT set it true again without restoring one of those.
  # ── TUNING (adjust frequently based on account size / market conditions) ─────
  # Position sizing
  base_lot: 0.25          # smallest leg lot; ladder scales up by lot_step per leg
  lot_step: 0.25           # lot increment per leg (leg_i = base + i×step, capped at max_lots)
  max_lots: 1.0          # hard cap per leg regardless of risk math (25x scale of the 0.01-era 0.04 cap)

  # Ladder shape — step is BTC Jun22 flat 0.50×ATR (consistent ~3×ATR span, scales with each
  # TF's own ATR). Leg count is per-TF: a CAP for width-driven strats (hvn_inside_touch,
  # lvn_edge_touch, bb_expansion_touch — n = node_width/step clamped here) and the EXACT
  # count for fixed-n strats (hvn_edge, candle_sweep). Step stays flat (do NOT re-add the
  # inverted per-TF step map — it over-compressed higher TFs → full_hedge).
  # 2026-07-20 TF-efficiency run: n FIXED at 5 on every TF so TIMEFRAME is the only
  # variable. (Was {1m:4, 5m:5, 15m:6, 1h:7} — n co-varied with TF, confounding the two.)
  # The cycle log records the n the planner actually chose after the node_width/step
  # clamp, so a later run can sweep n from that evidence.
  hvn_max_legs_by_tf: {}   # empty → flat hvn_max_legs (below) — Jun22 never had a per-TF leg map
  mean_rev_step_mult: 0.50    # step = this × ATR between legs (BTC Jun22 flat value)
  mean_rev_step_mult_by_tf: {}   # empty → flat 0.50 all TFs (was inverted per-TF, over-tight on higher TFs)
  # Absolute CEILING on step ($). NOT a floor — per-TF live data inverts: 15m does best
  # with step <2.0 (+1,258/cyc, 73%) while 5m does best at 2.0-3.5 (+901/cyc, 75%), so a
  # floor would push 15m's best band into a worse one. The 3.5-5.0 band is the weakest on
  # BOTH TFs (15m +40, 5m -104) — hence a ceiling only. 0 = off.
  mean_rev_step_max_usd: 3.50

  # Cycle profit target — primary basket exit (net floating ≥ target → CLOSE_ALL).
  # Flat, not per-TF: only 15m is live in this system, so a by_tf map is pure noise.
  # 1250 = 25x scale of the 0.01-lot-era 50.0 flat target (7991bc9 precedent).
  # Per-TF now that 15m AND 5m are live. 5m = 15m x 0.55, the measured ATR ratio at
  # actual arm times (5m median ATR 4.02 / 15m 7.25). Both knobs are $-denominated, so a
  # flat value silently means something different on each TF.
  cycle_net_target_by_tf: {15m: 1250.0, 5m: 690.0}
  cycle_net_target_usd: 1250.0   # fallback for any TF absent from the map above

  # Bias trail — arms when peak floating ≥ activate, fires on giveback% retrace.
  bias_trail_activate_by_tf: {15m: 250.0, 5m: 140.0}   # same 0.55 ATR ratio as net_target
  bias_trail_giveback_pct: 40    # Jun22 exact value
  bias_book_frac: 0.5            # Jun22 exact value — keep a BE runner

  # Squeeze multiplier — when a cycle was armed on a confirmed squeeze (squeeze_ok=True),
  # scale up targets so the system holds the runner longer into the expansion move.
  # 1.0 (2026-08-03) — was 2.0. Doubling net_target on coiled-armed cycles demanded 2x
  # from the WORST cohort: learnings §25 measured squeeze-armed cycles at 58% win (vs 70%
  # expanding) and a 4.3% TP-hit rate, so the multiplier pushed them toward a flatten
  # exit instead of a target. INFERENCE, not a measured isolation — revert to 2.0 if the
  # coiled cohort starts stranding.
  squeeze_target_mult: 1.0       # multiply cycle_net_target when squeeze_ok
  squeeze_trail_mult: 1.0        # multiply bias_trail_activate when squeeze_ok

  # Runtime expansion upgrade — flip squeeze_ok=True on a live cycle when expansion fires:
  # BBW has fully left compression (squeeze_gate=False) AND ATR is expanding vs recent mean.
  # Arms that were NOT coiled at entry get upgraded on the fly; arms that were already
  # squeeze_ok=True skip this block entirely.
  expansion_atr_ratio: 1.5       # session_atr_ratio threshold to confirm expansion

  # HTF-expansion gate for 1m hvn_inside_touch (2026-07-10, user): only ARM the 1m
  # hvn_inside_touch cycle while the 5m TF is in EXPANSION (5m squeeze_gate = not coiled).
  # Once 5m re-enters a squeeze (coiled), STOP arming fresh 1m cycles — a live 1m cycle
  # keeps riding to its normal exit (gate blocks new entries only). Thesis: trade the fast
  # 1m mean-revert straddle only while the higher TF is actively expanding, not when it coils.
  htf_expansion_gate:
    enabled: false                # OFF — this system only runs 15m; the gate exists to throttle
    kinds: [hvn_inside_touch]     # fast-TF (1m) arms against a higher TF, moot with no 1m active
    tfs: [1m]
    htf: 5m

  # Arm filter
  require_squeeze_gate: false    # OFF (2026-07-09, user relaxed) — data (2026-07-07): squeeze_ok arms net-NEGATIVE on 1m/5m (5m sqOK -733 avg / 20.8% full_hedge vs noSQ +433 / 9.1%); gate only helped 15m. Not earning its keep. Use per-side loss-cap / regime instead.

  # Safety
  # 2026-07-21: full-fill BE + cancel-opposite ON (was OFF, 9590331 baseline). Live -249
  # bleed root cause: a whipsaw filled ONE side, faded, the opposite ladder's pendings
  # stayed armed and could re-load wrong-way on the retrace — and a one-sided underwater
  # cycle reaches NO exit (trail needs +peak, net_target needs +pnl, full_hedge needs both
  # sides full). Now: once a side fully fills (move committed), MOVE_BE that side AND cancel
  # the opposite side's pendings so the reverse ladder can't re-load. cancel_opposite is
  # gated INSIDE the fullfill_be block, so BOTH must be true to fire. Tracking result on
  # exp/pre-server-tp-8d9f546.
  fullfill_be_enabled: false      # OFF — did not exist at 9590331; keeping this system Jun22-literal
  fullfill_cancel_opposite: false
  # After bias_trail books a side, also cancel THAT side's own resting pendings so the
  # just-booked direction can't re-load at worse prices once the BE-SL scratches the
  # runner (the re-loaded legs get no trail — bias_trail_done is spent — and no SL).
  book_cancel_own_pendings: false
  # Deferred structural SL (>50% of a side filled → SL at node edge). OFF — did not exist
  # at 9590331. false = committed side can't be stopped out; net_target/full_hedge own the exit.
  # (This is the gap a real broker-side SL needs to fill — see the branch header note above.)
  defer_sl_on_half_fill: false
  # Broker-side DISASTER stop, placed with every leg at order time ($ per oz from that
  # leg's OWN entry). This is the gap defer_sl_on_half_fill leaves open: every
  # server-side exit (net_target/bias_trail/full_hedge) dies with the server, and the
  # deferred SL above is both OFF and server-side. This one is broker-native — it
  # survives a bridge/terminal freeze, which is the case it exists for.
  #
  # Sized from ladder-span data (learnings §18, 832 same-side records, golden run):
  # cycles that RECOVERED had max span 15.4, p99 12.2. At $20 the count of recovering
  # sides that would have been cut is ZERO — it is a disaster bound, not a strategy
  # stop, and in normal operation must never fire. At base_lot 0.25 → $500/leg,
  # ~$3,000 per fully-filled 6-leg side.
  #
  # NOT a gap defence: Jul14 was +63pt in one minute; a $20 stop triggers inside the
  # gap and fills at the far side. Only position size defends against that (§18).
  # 0.0 disables.
  disaster_sl_usd: 20.0
  # HARD per-cycle loss cap ($ floating). The grid's only SERVER-side bounded loss exit;
  # circuit_breaker_r / max_dd_r live under `risk:` and are read ONLY by hedge_manager
  # and router — never by this path. Before this, the sole loss exits were full_hedge
  # (which needs BOTH sides fully loaded, i.e. it fires after the damage) and the broker
  # SL above. Live proof (07-29→08-01): 25 cycles booked +4,545 on the trail and ONE lost
  # -10,424 on full_hedge — 96% win rate, net NEGATIVE.
  # Shipped WIDE at 2x net_target and deliberately NOT tuned: cycle logs carry only final
  # P&L, so cycles that dipped past a cap and recovered are invisible and the right value
  # cannot be backtested. The new `trough` field logs running-min floating P&L per cycle;
  # set this from that data in ~2 weeks. 0.0 disables.
  cycle_max_loss_usd: 2500.0
  # ─────────────────────────────────────────────────────────────────────────────

  tp_atr_mult: 1.5
  hvn_max_legs: 6            # BTC Jun22 cap: n = node_width/step, clamped 2..6 (× flat 0.50 mult = ~3×ATR ladder half-span)
  # Minimum TP distance ($) beyond the outermost leg — a structural level closer than
  # this is skipped (keep walking out to the next). Stops the tiny-TP-into-own-node bug
  # (a fulcrum on an HVN edge had its into-node TP land ~2pt away). 0 = no floor.
  min_tp_dist: 8.0
  # Coarse outer guard: reject a fulcrum sitting >this fraction of price away from spot
  # (a stale/far cached-HVN edge) before any ladder math. The ladder-span gate
  # (|fulcrum-px| ≤ n·step) is the precise "is price actually at the edge" check; this is
  # just a sanity bound well outside any real ladder span. 0.05 (±~200pt @ gold) was far
  # too loose vs legit arms ~6pt off spot — tightened to 0.01 (±~40pt) 2026-06-24.
  max_fulcrum_dist_pct: 0.02
  # Cycle exit (server-side cycle monitor). DEMO ONLY — strategy is -EV.
  # Net-profit-exit-only: place legs with NO per-order TP so the winning side can't book
  # while the losing side dangles (a per-leg TP hit ≠ a net-positive cycle). The basket
  # net-target below then owns ALL profit-taking → a cycle only closes green when the
  # WHOLE basket is net ≥ target; bias_trail still rides clean winners; full_hedge cuts
  # the symmetric whipsaw (which is mathematically un-profitable at any single exit).
  net_profit_exit_only: true
  # Structural-TP-as-ceiling: even in net_profit_exit_only, place each leg's COMPUTED
  # structural TP (HVN reversion→POC, breakout→next-HVN, VP target) on the broker order
  # as a FAR ceiling — so the targets show on the chart/orders and a runaway move books at
  # structure. The basket net_target stays primary (it's closer → fires first in the
  # common case); the leg TP is the backstop. false = truly TP-less legs.
  leg_tp_ceiling: true
  # HVN inside-touch reversion bias: a rejection at an edge is a fade INTO the node.
  # SPLIT INTO TWO KEYS 2026-08-03 — they used to ride together, so you could not keep
  # the directional read without also taking the POC TP snap.
  #   hvn_reversion_bias   → the ±2 fade-side skew vote (_resolve_skew). Note the
  #     +1-leg asymmetry it once carried was disabled 2026-07-28 (446caed); _build_legs
  #     now forces buy_n == sell_n, so this only feeds TP context / _opposing_swing_range.
  #   hvn_reversion_tp_poc → the POC TP snap on the fade side, now OFF by default.
  # Why the snap is off: it overwrites the next-HVN far-edge TP at arm, and the REFRESH
  # path never reads the flag — so arm and refresh disagree and the TP shifts on the
  # first poll. POC also sits INSIDE the node, i.e. nearer than the far edge, so the snap
  # systematically SHORTENS the fade TP; learnings §20 measured the short-TP band at
  # -67,002 across 1,094 positions. Reasoned, not isolated-measured.
  hvn_reversion_bias: true        # skew vote only (2026-07-28, user)
  hvn_reversion_tp_poc: false     # POC TP snap — OFF (2026-08-03)
  # Wick proximity buffer for hvn_inside_touch: fire if wick came within this many price
  # units of the edge even without crossing it (e.g. 0.5pt catches near-misses on gold).
  # 0.0 = exact touch only (original behaviour). Edge is still the fulcrum price.
  hvn_touch_buffer: 0.2
  hvn_edge_lookback: 3           # bars to scan back for a prior breakout close outside HVN (fallback when TF not in _by_tf)
  # NOTE (2026-07-14): hvn_edge arms per-TF using that TF's SESSION HVN window (_VP_WIN:
  # 5m=288 bars, 15m=96), while the MT5 chart draws ONLY InpZoneTF (default 15m) zones. So a
  # 5m hvn_edge fulcrum legitimately sits on the 5m-window edge, NOT on the drawn 15m zone —
  # that specific chart-vs-fulcrum offset is EXPECTED, not the double-shift/ratio bug (fixed
  # 2026-07-14). Same-TF arms now match the drawn edge exactly. To make ALL TFs match the
  # chart, draw per-TF zones (EA recompile) — deferred by choice.
  hvn_edge_lookback_by_tf:       # per-TF breakout→retest window (2026-07-13): slow TFs need fewer bars to retest
    "5m": 15
    "15m": 5
  hvn_edge_tap_buffer: 0.05        # wick must come within this many $ of the HVN edge to qualify as a tap
  hvn_edge_min_step: 1.0          # minimum leg spacing ($); reduces n until step >= this (0 = no floor)
  # Width-relative buffer: a wide node's edge is unreachable with a flat 0.5pt buffer
  # (a 49pt node never gets a tap), so the effective buffer is max(hvn_touch_buffer,
  # node_width × hvn_touch_buffer_pct). 0.10 = a tap within 10% of the node width counts.
  # 0.0 disables the relative term (flat buffer only). 0.10 = tap within 10% of node width
  # counts — lets a wide node's edge register on rotational days WITHOUT changing node
  # geometry / grid sizing / structural-TP (exits are net-$ targets, so this is surgical).
  hvn_touch_buffer_pct: 0.02
  hvn_lookback_bars: 1          # candle-close trigger scans last N bars (restart recovery)
  # BROKER ORDER-RATE THROTTLE: min seconds between MODIFY_PENDING/MODIFY_POSITION per
  # (cycle, side). Built for Vantage's HFT-abuse limit (account 26443422 got algo-trading
  # disabled over ~1500 mods/hr). Account is now direct MT5 — throttle kept as a safety
  # margin, not because MT5 polices mod-rate the same way. 60 = re-track at most once/min
  # per side. 0 = no throttle.
  modify_cooldown_s: 0
  # HVN ZONE STABILIZATION (hysteresis on _session_hvn_zones output, zone_triggers.
  # _stabilize_zones). Rolling-VP recomputes are stateless → edges jitter and borderline
  # nodes flicker in/out, which downstream became fulcrum shifts / TP modifies / false
  # hvn_faded flattens (~24% of arms). Sticky edges + sticky deletion fix the input.
  hvn_stab_enabled: true
  hvn_stab_edge_tol_frac: 0.25    # keep old edge while new within 25% of zone width (min 2×bin)
  hvn_stab_del_n: 3               # zone absent N consecutive recomputes before it dies
  # FADE CONFIRMATION (pending-only cycles): hvn_faded needs N wall-clock-spaced strikes
  # before CLOSE_ALL; a check that finds the anchor again resets the count.
  hvn_fade_confirm_n: 3
  hvn_fade_strike_min_gap_s: 240
  # FROZEN-cycle pending re-anchor: once a leg fills the fulcrum is LOCKED for filled-leg
  # management, but resting (unfilled) pendings re-track the live HVN/LVN edge each bar-close
  # (pending-scoped, no fade-flatten, follows only a nearby edge ≤2×step). false = legs stay
  # pinned at arm-time prices (pre-2026-07-07 behaviour).
  reanchor_pending_when_frozen: true
  # ORDER-MODIFY NOISE FLOORS (fractions of the leg step; venue frame). Sub-step edge
  # wiggle must not reach the broker — modify rate is what Vantage flagged.
  hvn_shift_min_frac_step: 0.25   # fulcrum shift floor = max(frac×step, 0.1)
  tp_refresh_min_frac_step: 0.25  # TP refresh floor  = max(frac×step, 0.05)
  # VP HVN node tightness (scipy peak_widths rel_height in volume_profile._find_hvn_zones).
  # LOWER = tighter nodes: a peak's width is measured nearer its tip, so adjacent peaks that
  # blur into one wide blob at 0.5 separate into distinct tappable nodes. SYSTEM-WIDE: also
  # narrows TP next-HVN targets, fade detection, VA. 0.5 = legacy wide (prior behaviour);
  # 0.3 ≈ half-width. Reverted to 0.5 per user (prev logic worked better).
  vp_hvn_rel_height: 0.5
  # VP smoothing WIDTH in PRICE units (Gaussian, in volume_profile._smooth). Per-call sigma
  # = max(1.5 bins, vp_smooth_price / bin_size) → constant price-width smoothing: coarse-bin
  # symbols (BTC) stay at the legacy 1.5-bin floor; fine-bin XAU (0.25) gets more so single-bin
  # noise doesn't fragment into 1pt nodes. ≥1.0 re-blobs XAU into one wide node — keep ~0.5.
  vp_smooth_price: 0.7
  # HVN cluster merging (fixes fragmentation: many HVNs a few bins apart). Two adjacent HVN
  # peaks merge into one node when the gap ≤ vp_merge_gap_bins × bin_size AND the trough
  # between them stays shallow: min(gap bin vol) ≥ vp_merge_trough_ratio × smaller peak.
  # Deep trough (below ratio) = a REAL LVN vacuum → peaks kept split (LVN not erased).
  # gap_bins ↑ = more aggressive merge; trough_ratio ↑ = stricter (only very shallow shoulders merge).
  # Calibrated on XAU/BTC live cache: fragmented shoulders sit at trough≈0.55-0.62 of the smaller
  # peak, genuine LVN vacuums at ≤0.5 → 0.55 merges shoulders, keeps real LVNs split. gap_bins=20
  # spans the observed shoulder gaps (5-20 bins); trough gate is the real safety, gap just caps reach.
  vp_merge_gap_bins: 20
  vp_merge_trough_ratio: 0.55
  # Directional skew votes (skew-only — both sides still placed, favoured side heavier):
  # HTF Bollinger bias reads the NEXT TF up's 20-SMA (5m→15m, 15m→1h…) — price above a
  # rising 20MA = bull vote, below a falling one = bear. 2.5σ "edge" votes mean-reversion
  # when price is stretched ≥ bb_edge_sigma from the basis on the grid TF. (3.0σ stays the
  # squeeze.) Net vote sign skews the ladder → directional inventory → net-profit exit exists.
  htf_bias_enabled: true          # ON (2026-07-10, Jun22 restore) — HTF-20MA vote skews ladder → directional inventory
  htf_bias_period: 20
  htf_bias_slope_bars: 3
  htf_bias_map: {1m: "5m", 3m: "15m", 5m: "15m", 10m: "1h", 15m: "1h", 1h: "4h"}
  bb_edge_enabled: true           # ON (2026-07-10, Jun22 restore) — 2.5σ mean-rev edge vote
  bb_edge_sigma: 2.5
  # cycle_net_target_* and bias_trail_* moved to TUNING block at top of grid_levels
  cycle_hedge_decay_pct: 33      # effective target decays this % as the basket hedges to full (Jun19: 33 — hedged basket finds green exit sooner)
  cycle_min_target_usd: 0.33     # floor; must be >0 so a hedged cycle still has a positive net-$ exit
  cycle_close_on_full_hedge: true  # cut a fully-hedged (delta-neutral) cycle to free margin
  # Cycle value function (execution/cycle_value.py) — deterministic trail/kill prices
  # computed from the cycle's reconstructed order book (execution/cycle_book.py) instead
  # of fixed-USD bias_trail/net_target knobs. NOT live-wired yet: validation-only stub;
  # monitor_cycle integration is gated on the backtest reconstruction gate passing.
  cycle_value:
    enabled: false
    trail_step_mult: 1.0        # trail distance d = mult × cycle step (price units)
    floor_usd_by_tf: {}         # F — min locked profit at trail fire, per TF
    max_loss_usd_by_tf: {}      # L_max — kill_price bound, per TF
    broker_sl_backstop: true    # one enqueue_modify_sl at trail activation (server-death floor)
    recon_lots_tol: 0.005       # book_from_arm reconstructed-vs-reported lots tolerance
  # Orphan-pending sweep: a never-filled pending leg anchored on a fulcrum HVN that has
  # since DISAPPEARED from the live VP gets cancelled — but ONLY once the cycle's other
  # positions have all closed (no open legs left). Frees a stale dangling order whose
  # structural reason to exist is gone. Opt-in; the cycle must have filled at least once
  # (max_pos_seen>0) so a freshly armed straddle is never cancelled early.
  cancel_orphan_on_hvn_gone: true
  hvn_gone_tol_usd: 0.0   # venue-$ tolerance band around HVN edges when testing "gone" (0 = exact zone)
  # Full-fill breakeven: the moment ONE side fills ALL its legs the move has committed that
  # way, so the opposite resting ladder becomes a stop that would lock the full ladder span.
  # Cap that immediately — move the committed side to BE (SL=avg entry); filled side can no
  # longer lose. cancel_opposite=true also cancels the other side's pendings so they can't
  # fill on a retrace and create a new unhedged position.
  # fullfill_be_* moved to TUNING block at top of grid_levels
  # Bias-side trailing book: when ONE side has ALL its legs filled (the move committed
  # that way), track its peak floating P&L; on a give-back from peak, BOOK a fraction of
  # that side and move the rest to breakeven (risk-free runner). Captures directional
  # profit the net-basket exit masks (a hedge leg drags net down → target never hits).
  bias_trail_enabled: true      # ON — Jun22 had this on ($5 activate / 40% giveback / half-book)
  # NEW (2026-08-03), OFF by default: when the net-pnl giveback trigger fires, CLOSE_ALL
  # the whole cycle instead of CLOSE_SIDE+MOVE_BE (which books a fraction and continues).
  # Tagged exit_reason "net_pnl_trail_close" so it is never conflated with net_target
  # (only fires on a whole-basket ≥ target, different trigger) or the default partial
  # bias_book_trail rows. A whole-cycle version of this was tried once before (c34949b,
  # 07-24) and reverted same day; measure this before trusting it — see exec_bridge.py.
  bias_trail_full_close: false
  flatten_rest_enabled: false   # OFF, deliberately NOT Jun22-literal — see branch header note:
                                 # this is the leg_closed_other mass-flatten path, verified as the
                                 # exact mechanism behind the -$110k Jul14 buy-side dump.
  # 2026-07-30: re-derived in ATR/lot units instead of the inherited fixed-$ figure.
  #   activate = k · ATR(tf) · base_lot · contract · expected_legs
  #            = 0.5 · 5.0    · 0.25     · 100      · 4   = 250
  # Rationale (docs/learnings_2026-07-30.md §19): this knob took EIGHT different values
  # (5 → 750 → 1000 → 500 → 250 → 200 → 10 → 166.75) because a fixed dollar threshold
  # silently changes meaning every time base_lot or volatility moves. Expressed against
  # ATR × lot it is scale-free. 15m ATR(14) measured 5.00 over Jul06-13.
  # Trail books were profitable at EVERY historical setting (+30k..+68k/day); 40% giveback
  # had the best per-book average (+1,181 vs +875 at 50%), so giveback stays 40.
  bias_trail_activate_usd: 250.0
  # ── Active trigger list — the two setups that made money, 15m only.
  # Derived 2026-07-30 from the broker Positions table of live account 32255364
  # (3,959 positions, Jul06-20) — see docs/learnings_2026-07-30.md §3:
  #   hvn_inside_touch  15m  +29,010   |  1m −27,462  5m +9,311
  #   lvn_edge_touch    15m  +23,956   |  1m  −9,170  5m −6,846
  #   hvn_edge          −45,838 lifetime (5m −41,742)   → NOT re-added
  #   candle_sweep      −53,102 lifetime (5m −46,377)   → NOT re-added
  #   hvn_displacement   −4,332 / 11 positions          → NOT re-added
  #   squeeze            −1,735 / 36 positions          → NOT re-added
  # 15m is the ONLY net-positive TF on the whole account (+39,396 vs 1m −36,522,
  # 5m −88,859). Win rates were 60-66% on every strategy AND every TF — the
  # difference is loss magnitude, not hit rate: a 15m node is wide enough that the
  # ladder spans real price and reversion has room before a side fully commits.
  triggers:
    - kind: hvn_inside_touch
      tfs: [15m, 5m]
      # touch_only omitted (defaults false) → candle-close confirmation only. Jun22 had no
      # intrabar touch-arm mechanism at all; this system doesn't reintroduce one.
    - kind: lvn_edge_touch
      tfs: [15m]
      # touch_only omitted deliberately → candle-close, same as above. Live history ran
      # this touch_only:true from 07-07; keeping it bar-close here matches the Jun22
      # confirmation regime (the highest win-rate era, 78% on 06-22).
  candle_sweep_cooldown_bars: 0   # 0 = NO post-arm cooldown (2026-07-09: user "no cooldown"); default was 3 → 45min lockout on 15m suppressed fresh sweeps
  touch_arm_confirm_ticks: 0      # 0 = NO reversal wait — arm on the raw edge tap (2026-07-10, user)
  # lvn_edge_touch tap tolerances — mirror hvn_touch_buffer/_pct/hvn_lookback_bars but
  # independently tunable. 0.10 = tap within 10% of node width counts (same width-relative
  # logic as HVN).
  lvn_touch_buffer: 0.01      # 1¢ absolute floor
  lvn_touch_buffer_pct: 0.0   # width-relative buffer OFF
  lvn_touch_buffer_price_pct: 0.0002  # PRICE-relative buffer (2026-07-13) — 0.02% of price ≈ 0.82 @4090. tap within this of the drawn edge counts. 0.01 floor was unreachable: a 15m wick 0.40pt INTO the edge (visible on chart) failed the ≤1¢ test → lvn_edge armed nothing. buffer_eff = max(0.01, width·pct, price·price_pct).
  lvn_lookback_bars: 3
  # VP-level fulcrums (vp_level_touch) — arm a straddle when price taps a VP level.
  vp_fulcrum_levels: [poc, vah, val, naked_poc, lvn]   # which VP levels are fulcrums
  vp_tol_atr_mult: 0.25      # tap "test" band = max(this·ATR, vp_tol_pct·price)
  vp_tol_pct: 0.0005         # ATR-free floor for the tap band (replay safety)
  vp_merge_atr_mult: 0.15    # merge coincident VP levels within this·ATR (stronger wins)
  emit_dedup_pct: 0.0007     # skip re-arm if fulcrum moved < this·venue_mid (anti-churn) — realizes a loss
  # Volatility compression→expansion via Bollinger BANDWIDTH PERCENTILE (vol-regime
  # gate): compression = BBW in the bottom squeeze_bbw_pct of its trailing window; fire
  # on RELEASE after a run. Neutral straddle positions before the displacement.
  squeeze_enabled: true           # ON (2026-07-09, user override) — see require_squeeze_gate note
  squeeze_bb_period: 20
  squeeze_bb_mult: 3.0        # Bollinger band = 3·stdev
  squeeze_bbw_pct: 0.15       # compression = BBW in bottom 15% of the trailing window
  squeeze_bbw_window: 100     # trailing window (bars) for the BBW percentile rank
  squeeze_magic: 770002      # distinct MT5 magic for squeeze grid legs (MUST match EA InpMagicSqueeze); 0 = default magic
  squeeze_min_on_bars: 6     # require ≥this consecutive compressed bars before a release fires
  squeeze_max_bars_since_release: 0   # bars allowed between coil-release and arm; 0 = NO limit
  squeeze_release_lookback: 120       # how far back to scan for the coil (bounded by history, not freshness)
  # ── BB expansion touch trigger ──────────────────────────────────────────────
  # Arms when: squeeze released → BB expanding → price taps the 2.5σ band
  # + HTF BB direction aligns (hard gate) + optional footprint absorption confirms.
  # Fulcrum = BB mid (20-SMA); counter-side SL = BB mid (answers the "SL at center" question).
  bb_expansion_touch_enabled: false  # SIMPLE: disabled
  bb_expansion_post_squeeze_bars: 10  # max bars after squeeze release to be "post-squeeze"
  bb_expansion_touch_sigma: 2.5       # band edge σ to detect as a touch (2.0 = earlier, 3.0 = extreme)
  bb_expansion_touch_lookback: 3      # scan last N bars for a band touch during the expansion
  bb_expansion_htf_gate: true         # upper touch needs HTF bearish; lower touch needs HTF bullish
  bb_expansion_fp_gate: true          # require close-failure absorption on the touch bar
  # Candle sweep / engulf breakout grid
  # Detects outside-bar sweeps (current bar engulfs prev high AND low, closes outside) or
  # plain body engulfs (close beyond prev high/low). Buy grid above candle high, sell below
  # candle low. Step = candle_hl / n (same zone-width logic as hvn_inside_touch).
  # SL at arm: candle_low for buys, candle_high for sells (structural stop = whole candle).
  # VWAP-BE: once P&L ≥ candle_hl × base_lot × contract_size, SL moves to session POC.
  # Bar-close trail: SL trails to bar low (buys) / bar high (sells) each candle close.
  candle_sweep_min_size: 3.0          # minimum candle HL in price units to qualify (filter tiny bars)
  candle_sweep_contract_size: 100     # oz/lot for XAUUSD — used to compute be_distance_usd
  # Vol-compression GATE (applies to ALL triggers, not just squeeze): only arm a grid when
  # vol has coiled (BB 3σ compression now, or a ≥squeeze_min_on_bars coil that ended within
  # squeeze_gate_max_bars). A straddle pays on expansion FROM a coil → this filters the
  # trending regimes that whipsaw-fill both sides. Cuts arm frequency for quality.
  # OBSERVE/LABEL mode for the squeeze A/B: false = arm BOTH coiled & uncoiled grids,
  # each tagged squeeze_ok in the arm + exit audits (data/exec_emit.jsonl) so outcomes can
  # be bucketed squeeze-pass vs squeeze-fail. Flip to true to ENFORCE (skip uncoiled) once
  # the data favours the gate. The label is stamped either way.
  squeeze_gate_max_bars: 20  # how stale a just-ended coil may be and still pass the gate

# VP warm-up floor — minimum bars before a cached VP (HVN/LVN/POC) is built. Below this a
# profile is a single-cluster degenerate, so /exec/zones returns empty. Was hardcoded 30
# (~30min into a session before zones appear). 5 = zones ~5min after a session roll; thinner
# structure but avoids the 1-bar degenerate. Read fresh by pipeline/features/vp_cache.py.
vp_min_bars: 5

# Startup preflight — server REFUSES to start unless footprint + VP data are present.
startup_check:
  enabled: true
  min_days: 5                # require ≥5d footprint span + ≥5 daily VP periods / symbol
  max_period_age_days: 3     # latest VP daily period must be this fresh (3d allows weekend)
  require_hvn: true          # latest VP period must carry HVN zones
  stale_warn_hours: 6        # WARN (not block) if newest footprint bar older than this
  min_density_pct: 0.5       # WARN if <50% of expected bars in the window (gaps)
  # symbols / tfs default to vp_cache.symbols and instrument.timeframes
  symbols: [XAUTUSDT]   # GOLD-ONLY preflight gate (2026-07-10): BTC's just-opened daily VP
                        # period goes thin at IST day-roll (no HVN yet) → was hard-blocking
                        # boot while gold is the live target. BTC is analysis-only backup;
                        # still INGESTED (vp_cache.symbols unchanged), just not a boot gate.

claude:
  mode: restricted           # full | restricted | off
  model: claude-sonnet-4-6
  fallback_model: claude-opus-4-7   # used when validator flags ambiguity
  cache: true
  max_tokens_out: 600
  timeout_s: 90

prompt:
  active_version_file: prompts/system/current.txt
  recent_bars: 20          # 20 bars = 5h context at 15m (was 10)
  few_shot_count: 4

ingress:
  format_default: bybit_v1   # atas_v1 | bybit_v1 | exness_v1 | capital_v1 | userscript_v1

# VP cache — pre-computed on server start, updated at day/week boundaries
vp_cache:
  symbols: [BTCUSDT, XAUTUSDT]   # Analysis only — Bybit feed. Vantage = execution venue, no ticks ingested.
  # Per-symbol daily session anchor. Two forms accepted:
  #   <int>             — static UTC hour (DST-naive; fine for 24/7 crypto)
  #   {tz, hour}        — local-time anchor, automatically DST-adjusted via zoneinfo
  # XAUTUSDT anchor moved off CME's 18:00 ET open (22:00 UTC) to midnight UTC 2026-07-08.
  session_start_utc:
    BTCUSDT: 0      # UTC 00:00 = IST 05:30 → session 05:30 IST – 05:29 IST (24h)
    XAUTUSDT: 0     # UTC 00:00 = IST 05:30 → session 05:30 IST – 05:29 IST (24h)
  # Tick-aligned VP bin width (institutional convention).
  # Falls back to range/68 if symbol not declared. Set in floats matching tick:
  #   XAU tick = 0.1 → 0.5 = 5-tick bins
  #   BTC tick = 0.1 → 1.0 = 10-tick bins
  vp_bin_size:
    BTCUSDT:  25.0          # 25$ bins (Sierra/Bookmap convention for BTC ~1300/day range = ~52 bins)
    XAUTUSDT: 0.4           # 0.4 = coarsest bin where the 1.5-bin smoothing floor (0.6$) still
                            # lands below gold's ~2$ node spacing → resolves 3 distinct HVN + clean
                            # LVNs (bin 1.0 collapsed to ONE 18$ blob with 0 LVNs). Edge precision
                            # ±0.2 vs ±0.5 at 1.0. The old jitter→broker-churn risk is now handled
                            # centrally by grid_levels.modify_cooldown_s (caps mods ~1.3/min
                            # regardless of edge wiggle), so fine bin no longer means HFT churn.
  # ── DRAWN VP histogram only (TV/GoCharting-style smooth curve) — fully decoupled from the
  # detection/grid bins above, so this doesn't change HVN/LVN, fulcrum, or grid sizing.
  # vp_profile_bin: finer per-symbol bin used ONLY for the chart histogram (high resolution).
  # vp_profile_smooth: Gaussian sigma (PRICE units) applied to the drawn curve. 0 = raw bars.
  # The server smooths then downsamples to ≤256 points so fine bins stay performant on the EA.
  vp_profile_bin:
    XAUTUSDT: 0.1            # 0.1$ (full tick res) for a smooth gold profile; grid still uses 0.4
  vp_profile_smooth: 0    # Gaussian (price units) — 0 = raw bars (matches /dashboard); 1.0 curve, 1.5 over-blobs
  vp_profile_days: 5       # how many TRADING-day VP histograms the EA draws (Sat/Sun sessions
                           # skipped; each anchored at its session start; newest = today rolling)
  vp_profile_points: 200   # rows: 200 renders the 0.1$ tick-res bins as a fine TV-style profile
                            # (was 40 = chunky). Chart-draw only — detection/grid bins unaffected.
  # Drawn HVN/LVN: merge prev-D ∪ today into ONE clean set; combine nodes within this gap ($)
  # so the chart isn't a cluttered interleave of two overlapping sets. 0 = overlaps only.
  vp_zone_merge_gap: 0.0
  vp_draw_today_zones: false  # true = restore the old prev-D + today_* dual overlay (distinct colors)
  # Intra-day VP refresh — rebuild current day's POC/VAH/VAL/HVN/LVN every N
  # primary-TF bars. Default 5 = every 5 minutes at 1m primary TF. Set 0 to disable.
  intraday_refresh_bars: 5
  # Venue price offset — shifts all VP levels (POC/VAH/VAL/HVN/LVN) to match execution venue.
  # "auto": compute at build time from Vantage MT5 mid vs ByBit last close (requires MT5 reachable).
  # <float>: static offset in price units applied directly (positive = Vantage trades higher than ByBit).
  # null / omitted: no shift (ByBit prices used as-is).
  venue_price_offset:
    BTCUSDT: null
    XAUTUSDT: "auto"

# Execution venue (Vantage MT5 via MetaApi)
execution:
  broker: vantage_mt5
  broker_utc_offset_hours: 3      # Vantage server time = UTC+3 (EET); used to shift CVD arrow timestamps
  tradable_symbols: [XAUTUSDT, BTCUSDT]
  symbol_map:
    # DEMO VALIDATION PHASE (2026-07-29): account 25798248 confirmed demo by user. Pointed
    # at XAUUSD+ to match what's actually connected right now — proving out the crude Jun22
    # HVN-rotation system here before any real capital. Flip to "XAUUSD.pc" (the real USC
    # cent account symbol) only once the EA is re-attached to the real account's chart.
    XAUTUSDT: "XAUUSD+"
    BTCUSDT:  "BTCUSD"
  # Risk-adjusted sizing: lots = (balance × risk_per_trade_pct) / (SL_distance × contract_size)
  # Set risk_per_trade_pct = 0 to disable; falls back to default_lots.
  risk_per_trade_pct: 0.0025    # 0.25% of equity per trade
  max_lots: 1.0                 # hard cap regardless of risk math
  default_lots:                 # fallback when risk math fails (no SL, etc.)
    "XAUUSD.pc": 0.01            # micro lot — USC cent account (25k USC = ~$250)
    "XAUUSD+": 0.01              # micro lot — USD standard account
    "BTCUSD": 0.001
  metaapi_timeout_s: 30
  order_comment_prefix: "FB"
  # Direct-MT5 adapter (wine rpyc shim) — used when broker: vantage_mt5_direct.
  # Distinct magic from the EA grid (770001) so reconcile/close-all never cross.
  direct_magic: 770010
  direct_port: 18812            # localhost rpyc port (scripts/mt5_server.sh)
  direct_deviation: 20
  # Paper-mode simulation: matches live risk math without a broker connection
  paper_balance: 100000
  contract_size:                # used by paper lot simulation
    XAUTUSDT: 100
    BTCUSDT: 1
    "BTCUSD": 1
    "XAUUSD+": 100
    "XAUUSD.pc": 100
  # Pre-trade execution gates (live only — checked in MT5Adapter.submit_order)
  max_spread:                   # reject order if (ask-bid) exceeds, per broker symbol
    "XAUUSD.pc": 0.50
    "XAUUSD+": 0.50
    "BTCUSD": 50.0
  news_blackout_utc: []         # e.g. ["12:25-12:35", "18:00-18:05"] — no orders in these UTC windows

# Risk controls (used by ingest DD halt + hedge_manager circuit breaker)
risk:
  base_lot_size: 0.01          # base unit for hedge sizing (× leg_count)
  circuit_breaker_r: -5.0      # force-close all when net unrealized R below this
  max_cycles: 3                # max concurrent recovery cycles per symbol
  max_legs_per_cycle: 6        # max legs per cycle (total exposure cap = max_cycles × this)
  daily:
    max_dd_r: 4.0              # halt + close all + block re-entry when daily realized R ≤ -this

# Daily floating P&L target — close all grid positions and block new arms for the day
# once equity rises by this % above the session-open balance.
# 0 = disabled. Example: 1.5 = close everything once up 1.5% on the day.
daily_target_pct: 100.0

# Dhan options trading configuration
dhan:
  # Broker for /options/decide route. Set execution.broker: dhan + mode: live to use.
  default_lots: 1          # lots per trade (quantity = lots × instrument.lot_size)
  max_lots: 2              # hard cap
  # Per-symbol lot overrides (optional)
  lots_per_symbol:
    NIFTY: 1
    BANKNIFTY: 1
    FINNIFTY: 1
  # Options SL/TP as fraction of entry premium (only used for premium-based stops)
  sl_premium_pct: 0.50     # exit if option LTP drops to 50% of entry premium
  tp_premium_pct: 1.00     # exit if option LTP reaches 200% of entry premium (+100%)
  # IV rank thresholds
  iv_rank_max_buy: 70      # skip buying options when IV rank > this (IV crush risk)
  # Market hours gate (NSE: 9:15–15:30 IST = 03:45–10:00 UTC)
  active_hours_utc: "03:45-10:00"
  # Options decide filter
  options_decide_filter:
    min_confidence: 0.55         # lower than futures — options need less certainty for entry
    same_direction_cooldown: 2   # block if last 2 decisions same direction
    skip_0dte: true              # skip on expiry day (0DTE) unless forced

# Pre-filter for /decide — skip Claude call when local features signal no setup.
# Pass {"force": true} in /decide body to bypass.
decide_filter:
  min_abs_delta: 2.0        # tune per symbol (BTCUSDT ~10-50, XAUTUSDT ~2-5)
  min_confidence: 0.60      # reject Claude decisions below this confidence
  require_stacked: false
  require_absorption: false
  require_structural_setup: true   # pre-filter: skip if no stacked+sweep+va_touch+delta
  va_touch_atr_mult: 0.3           # price within 0.3×ATR of VAH/VAL/POC = va_touch
  min_delta_atr_ratio: 0.0         # |delta|/ATR floor (0=disabled, tune after 50 cycles)
  min_stack_atr_pct: 0.15          # stacked zone must span ≥ 15% of ATR (filters XAU micro-stacks)
  active_hours_utc: ""      # e.g. "07:00-17:00" to skip Asian dead zone (empty = always on)
  same_direction_cooldown: 3  # block if last 2 non-flat decisions same direction (0=disabled)
  rr_floor: 1.5             # default R:R floor (overridden per-symbol below)
  rr_floor_per_symbol:
    XAUTUSDT: 1.2           # gold 15m ranges are structurally tighter — 52% WR at 1.1-1.4
    BTCUSDT: 1.5
  # Tier 5.1 — symbols where Claude (M1) is disabled. Direction handled by M2 rules only.
  # XAUTUSDT cut 2026-05-29 (M1: 42% WR / -3.03R; M2 paper: 73% WR).
  disabled_symbols: [XAUTUSDT]
